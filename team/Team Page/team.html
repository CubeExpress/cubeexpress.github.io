<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Team</title>
    <style>
       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

       
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #c33764 0%, #1d2671 100%); 
            padding: 40px 20px;
        }

        
        .team-container {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 900px; /* Ajusté pour que 3 cartes rentrent bien */
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

       
        .header-section {
            margin-bottom: 40px;
        }

        .header-section .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
        }

        .header-section h1 {
            font-size: 2.5rem;
            color: #111;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .header-section p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 25px;
        }

        /* --- Boutons --- */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #2b0b98;
            color: white;
            border: 2px solid #2b0b98;
        }

        .btn-primary:hover {
            background-color: #1a0563;
        }

        .btn-secondary {
            background-color: transparent;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            border-color: #999;
        }

        
        .team-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

       
        .member-card {
            background-color: #fff;
            border: 1px solid #ebebeb;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            
           
            width: calc(33.333% - 15px);
            min-width: 220px;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        
        .member-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: top; 
            border-bottom: 1px solid #f0f0f0;
        }

        
        .placeholder-img {
            width: 100%;
            height: 220px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #aaa;
            font-size: 2rem;
            border-bottom: 1px solid #e0e0e0;
        }

        
        .member-info {
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }

        .member-info h3 {
            font-size: 1.1rem;
            color: #222;
            margin-bottom: 10px;
            font-weight: 600;
        }

        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
        }

        .social-icons .icon {
            width: 20px;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 4px;
            display: inline-block;
        }

        
        @media (max-width: 850px) {
            .member-card {
                width: calc(50% - 10px); 
            }
        }

        @media (max-width: 550px) {
            .member-card {
                width: 100%; 
            }
            .team-container {
                padding: 30px 20px;
            }
            .header-section h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="team-container">
        
        <!-- En-tête -->
        <div class="header-section">
            <div class="subtitle">Team Section</div>
            <h1>Meet the Team</h1>
            <p>Meet our team of professionals to serve you</p>
            
            <div class="buttons">
                <a href="About us.html" class="btn btn-primary">About us</a>
                <a href="contact.html" class="btn btn-secondary">Contact</a>
            </div>
        </div>

        <!-- Grille des membres -->
        <div class="team-grid">

        

            
            <div class="member-card">
                  <img src="images/photo2.jpg">
                <div class="member-info">
                    <h3> Ouedraogo Charifa</h3>
                    <div class="social-icons"><span class="icon"></span><span class="icon"></span><span class="icon"></span></div>
                </div>
            </div>

            
            <div class="member-card">
                <img src="images/Christina.jpg">
                <div class="member-info">
                    <h3>Heaven Christina</h3>
                    <div class="social-icons"><span class="icon"></span><span class="icon"></span><span class="icon"></span></div>
                </div>
            </div>

            
            <div class="member-card">
                <div class="placeholder-img">📷</div>
                <div class="member-info">
                    <h3>Zarrad Yasmine</h3>
                    <div class="social-icons"><span class="icon"></span><span class="icon"></span><span class="icon"></span></div>
                </div>
            </div>

            
            <div class="member-card">
                <img  src="images/Zackary1.jpg">
                <div class="member-info">
                    <h3>Maidorn Zachary</h3>
                    <div class="social-icons"><span class="icon"></span><span class="icon"></span><span class="icon"></span></div>
                </div>
            </div>

            
            <div class="member-card">
                <img src="images/Raiso.jpg">
                <div class="member-info">
                    
                    <h3>Ibrahim Rayso</h3>
                    <div class="social-icons"><span class="icon"></span><span class="icon"></span><span class="icon"></span></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
