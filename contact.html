<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeExpress - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Styles Globaux --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- Le Background coloré (comme la page Team) --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a83c8a 0%, #2b1a7a 100%); /* Dégradé violet/rose */
            padding: 40px 20px;
        }

        /* --- Le conteneur sombre --- */
        .contact-container {
            background-color: #2d2d2d; /* Gris très foncé */
            border-radius: 20px;
            padding: 50px 60px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }

        .contact-container h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* --- Styles du formulaire --- */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .required {
            color: #ff4757; /* L'étoile rouge */
        }

        /* Conteneur pour le nom (Prénom et Nom côte à côte) */
        .name-row {
            display: flex;
            gap: 15px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* --- Les champs de texte --- */
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 25px; /* Bords très arrondis */
            background-color: #eaeaea; /* Gris clair */
            font-size: 1rem;
            color: #333;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        textarea {
            border-radius: 20px;
            resize: vertical; /* Permet de tirer pour agrandir */
            min-height: 120px;
        }

        /* --- Petits textes sous les champs --- */
        .sub-label {
            font-size: 0.85rem;
            color: #bbb;
            margin-top: 5px;
            margin-left: 15px;
        }

        /* --- Le bouton Submit --- */
        .submit-btn {
            display: block;
            margin: 40px auto 20px auto;
            padding: 12px 40px;
            background-color: #d33c5c; /* Le rose/rouge du bouton */
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #b02a46;
            transform: scale(1.05);
        }

        /* --- Bouton retour à l'équipe --- */
        .back-link {
            display: block;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }

        /* --- Responsive (Mobile) --- */
        @media (max-width: 600px) {
            .contact-container {
                padding: 30px 20px;
            }
            .name-row {
                flex-direction: column;
                gap: 0;
            }
            .input-wrapper {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-holder">
            <img src="img/logo-icon.png" alt="CubeExpress Logo" />
            <span>CubeExpress</span>
        </a>
        <span class="motto">Innovation, Mobility, Freedom</span>
        <nav>
            <a href="index.html""><img src="img/home.svg" /><span>HOME</span></a>
            <a href="features.html"><img src="img/info.svg"><span>FEATURES</span></a>
            <a href="pricing.html"><img src="img/money.svg"><span>PRICING</span></a>
            <a href="team.html" class="current"><img src="img/person.svg"><span>TEAM</span></a>
        </nav>
    </header>
    <main>
        <div class="contact-container">
            <h1>Contact Us</h1>

            <form action="https://formspree.io/f/xaeqgjwe" method="POST">
                <!-- Champ Nom -->
                <div class="form-group">
                    <label>Full name <span class="required">*</span></label>
                    <div class="name-row">
                        <div class="input-wrapper">
                            <input type="text" name="firstname" required>
                            <span class="sub-label">First</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" name="lastname" required>
                            <span class="sub-label">Last</span>
                        </div>
                    </div>
                </div>

                <!-- Champ Email -->
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" name="email" required>
                </div>

                <!-- Champ Message -->
                <div class="form-group">
                    <label>Leave us a few words <span class="required">*</span></label>
                    <textarea name="message" required></textarea>
                </div>

                <!-- Bouton Envoyer -->
                <button type="submit" class="submit-btn">Submit</button>
            </form>

            <!-- Lien pour revenir à la page de l'équipe -->
            <a href="team.html" class="back-link">← Back to team page</a>
        </div>
    </main>
    <footer>
        <p class="copyright">© Copyright 2026 CubeExpress Inc.</p>
        <p class="disclaimer">This is a ficticious website created for a school project. People, products, and companies mentioned do not exist.</p>
    </footer>
</body>
</html>
